<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="theme-color" content="#F5F3EE"/>
<title>LifeOS Study Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Geist+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
:root{--bg:#F5F3EE;--bg-elev:#FBFAF6;--card:#FFFFFF;--ink:#161514;--ink-2:#3B3936;--muted:#8A857E;--line:#E7E2D8;--line-soft:#EFEBE1;--accent:#B8451E;--accent-ink:#7A2C11;--accent-soft:#F5E4DA;--gold:#B8892A;--green:#2F6B3A;--red:#B0342B;--blue:#28496B;--radius:16px;--shadow:0 1px 2px rgba(20,20,15,.04),0 8px 24px -12px rgba(20,20,15,.08);--shadow-lg:0 4px 12px rgba(20,20,15,.06),0 24px 60px -20px rgba(20,20,15,.18);--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:contain;min-height:100dvh;padding-bottom:calc(84px + var(--safe-b))}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font-family:inherit;color:inherit;background:transparent;border:0;outline:0;width:100%}
a{color:var(--accent-ink);text-decoration:none}::selection{background:var(--accent);color:#fff}
.wrap{max-width:520px;margin:0 auto;min-height:100dvh;position:relative}
.appbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--bg) 78%,rgba(245,243,238,0));padding:calc(14px + var(--safe-t)) 20px 8px}
.appbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.brand .name{font-family:'Fraunces',serif;font-weight:500;font-size:20px;letter-spacing:-.01em}
.brand small{font-family:'Geist Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:-2px}
.pill-icon{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);font-size:15px;position:relative}
.subnav{display:flex;gap:6px;overflow:auto;padding:6px 20px 12px;scrollbar-width:none}.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:0 0 auto;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);border:1px solid transparent}
.subnav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(251,250,246,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding:8px 12px calc(10px + var(--safe-b))}
.tabbar-inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;color:var(--muted);font-size:10px;font-weight:500}
.tab i{font-size:17px}.tab.on{color:var(--ink)}.tab.on i{color:var(--accent)}
.screen{padding:4px 20px 40px;display:none;animation:fade .28s ease}.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}.card+.card{margin-top:12px}
.card h3{margin:0 0 4px;font-family:'Fraunces',serif;font-weight:500;font-size:18px;letter-spacing:-.01em}
.card .sub{color:var(--muted);font-size:12px;margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--line-soft);color:var(--ink-2);font-size:11px;font-weight:500}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}.chip.g{background:#E6F1E7;color:var(--green)}.chip.r{background:#F7DEDB;color:var(--red)}.chip.b{background:#DDE6F0;color:var(--blue)}.chip.gd{background:#F3E7C9;color:var(--gold)}
.money{font-family:'Geist Mono',monospace;font-weight:600;letter-spacing:-.02em}
.mono{font-family:'Geist Mono',monospace}
h1.section-title{font-family:'Fraunces',serif;font-weight:500;font-size:28px;letter-spacing:-.02em;margin:6px 0 2px}
.section-sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.field{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px}
.field.compact{padding:8px 10px}
.field input,.field textarea,.field select{font-size:14px}
.field label{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.field .col{flex:1;display:flex;flex-direction:column;gap:2px}
.field textarea{resize:vertical;min-height:64px;padding-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:12px;background:var(--ink);color:#fff;font-weight:500;font-size:14px;transition:opacity .15s}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.accent{background:var(--accent)}.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.block{width:100%}.btn:disabled{opacity:.5;pointer-events:none}
.fab{position:fixed;right:calc(50vw - 240px);bottom:calc(96px + var(--safe-b));z-index:45;width:52px;height:52px;border-radius:16px;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow-lg);font-size:18px}
@media(max-width:560px){.fab{right:18px}}
@keyframes spin{to{transform:rotate(360deg)}}.fa-spin{animation:spin 1s linear infinite}
.item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line-soft)}.item:last-child{border-bottom:0}
.item .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:0 0 20px;margin-top:2px;display:grid;place-items:center;color:transparent;font-size:10px}
.item.done .ck{background:var(--ink);border-color:var(--ink);color:#fff}
.item.done .t{color:var(--muted);text-decoration:line-through}
.item .t{font-weight:500;font-size:14px}
.item .m{color:var(--muted);font-size:12px;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .actions{display:flex;gap:4px;opacity:.6}.item .actions button{color:var(--muted);padding:4px}
/* Projects vertical */
.proj-col{background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.proj-col h4{margin:2px 4px 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.proj-col .pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:13px;cursor:pointer}
.proj-col .pcard .n{font-weight:600;margin-bottom:2px}.proj-col .pcard .d{color:var(--muted);font-size:11px}
.notes-grid{columns:2;column-gap:10px}
.note-card{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer}
.note-card h4{margin:0 0 4px;font-size:14px;font-weight:600}
.note-card p{margin:0;font-size:12px;color:var(--ink-2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.note-card .tgs{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.note-card img.att{width:100%;border-radius:8px;margin-top:8px}
.gal-groups{display:flex;gap:8px;overflow:auto;padding-bottom:8px;scrollbar-width:none}.gal-groups::-webkit-scrollbar{display:none}
.gal-groups .g{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:500}
.gal-groups .g.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.gal-grid .cell{aspect-ratio:1;background:var(--line-soft);border-radius:8px;position:relative;overflow:hidden}
.gal-grid .cell img{width:100%;height:100%;object-fit:cover}
.gal-grid .cell .info{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:9px;padding:2px 5px;border-radius:5px}
.acc-row{display:flex;gap:8px;overflow:auto;padding:2px 0 6px;scrollbar-width:none}.acc-row::-webkit-scrollbar{display:none}
.acc-card{flex:0 0 148px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.acc-card .lbl{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.acc-card .amt{font-family:'Geist Mono',monospace;font-weight:600;font-size:18px;margin-top:6px;letter-spacing:-.02em}
.acc-card.total{background:var(--ink);color:#fff;border-color:var(--ink)}
.acc-card.total .lbl{color:rgba(255,255,255,.7)}
.calc-display{background:var(--ink);color:#fff;border-radius:16px;padding:18px;text-align:right}
.calc-display .expr{font-family:'Geist Mono',monospace;font-size:13px;color:rgba(255,255,255,.5);min-height:16px;word-break:break-all}
.calc-display .res{font-family:'Geist Mono',monospace;font-size:34px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.k{padding:16px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;font-family:'Geist Mono',monospace;font-size:17px;font-weight:500}
.k.op{background:var(--bg-elev);color:var(--accent-ink)}.k.eq{background:var(--accent);color:#fff;border-color:var(--accent)}
.focus-cover{position:fixed;inset:0;background:#0B0B0A;color:#fff;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.focus-cover.on{display:flex}
.focus-cover .clock{font-family:'Geist Mono',monospace;font-weight:600;font-size:min(22vw,120px);letter-spacing:-.03em}
.focus-cover .lbl{font-family:'Fraunces',serif;font-style:italic;color:rgba(255,255,255,.55);font-size:15px;margin-top:20px;max-width:80%}
.focus-cover .actions{display:flex;gap:10px;margin-top:32px}
.focus-cover .btn{background:#fff;color:#0B0B0A}
.focus-cover .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff}
.focus-cover .qt{position:absolute;top:32px;left:24px;right:24px;font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:rgba(255,255,255,.4)}
.sheet-bg{position:fixed;inset:0;background:rgba(20,18,15,.4);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--card);border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1.1);max-height:92dvh;overflow:auto;padding:20px 20px calc(28px + var(--safe-b))}.sheet.on{transform:translateY(0)}
.sheet .grip{width:38px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-family:'Fraunces',serif;font-weight:500;font-size:22px;letter-spacing:-.02em}
.sheet .close{position:absolute;top:16px;right:16px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}.toast.on{opacity:1}
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:13px}.empty i{font-size:26px;color:var(--line);margin-bottom:10px;display:block}
.setup{background:#FFF8EB;border:1px solid #F0DDB0;color:#7A5A15;padding:12px 14px;border-radius:12px;font-size:12px;margin:8px 0}.setup b{display:block;margin-bottom:4px;color:#5B4210}
.tl{padding-left:14px;border-left:2px solid var(--line-soft);margin-top:8px}
.tl .e{position:relative;padding:6px 0 6px 10px;font-size:12px;color:var(--ink-2)}
.tl .e::before{content:"";width:8px;height:8px;background:var(--accent);border-radius:50%;position:absolute;left:-19px;top:11px;box-shadow:0 0 0 2px var(--card)}
.tl .e time{display:block;font-family:'Geist Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:2px}
.hidden{display:none!important}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.text-muted{color:var(--muted)}.center{text-align:center}
[data-role]{cursor:pointer}
.stat-mini{background:var(--bg-elev);border:1px solid var(--line-soft);border-radius:12px;padding:10px;text-align:center}
.stat-mini .v{font-family:'Geist Mono',monospace;font-weight:700;font-size:20px;color:var(--ink)}
.stat-mini .l{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.06em}
.dash-img{width:100%;border-radius:14px;object-fit:cover;max-height:200px;cursor:pointer;border:1px solid var(--line)}
.habit-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.habit-cell{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:600;background:var(--line-soft);color:var(--muted);cursor:pointer;position:relative}
.habit-cell.done{background:var(--green);color:#fff}.habit-cell.today{border:2px solid var(--accent)}
.habit-cell .hr{position:absolute;bottom:1px;right:2px;font-size:6px;color:var(--gold)}
.vocab-card{background:var(--bg-elev);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.vocab-card .wl{flex:1}.vocab-card .w{font-weight:700;font-size:15px;color:var(--accent-ink)}.vocab-card .mg{font-size:12px;color:var(--ink-2);margin-top:2px}
.draw-cover{position:fixed;inset:0;background:#fff;z-index:100;display:none;flex-direction:column}.draw-cover.on{display:flex}
.draw-toolbar{display:flex;gap:6px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.draw-toolbar button{padding:6px 10px;border-radius:8px;font-size:12px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;gap:4px}
.draw-toolbar input[type=color]{width:28px;height:28px;border:0;padding:0;cursor:pointer;border-radius:6px}
.draw-toolbar input[type=range]{width:60px}
#drawCanvas{flex:1;touch-action:none;cursor:crosshair}
.pin-card{background:#FFFDF5;border:1px solid #F0DDB0;border-radius:12px;padding:10px 12px;margin-bottom:8px;position:relative}
.pin-card .pin-del{position:absolute;top:6px;right:8px;color:var(--muted);font-size:12px}
.pin-card img{max-width:100%;border-radius:8px;margin-top:6px}
.voice-dot{width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dn{font-size:10px;color:var(--muted);text-align:center;padding:4px 0;letter-spacing:.08em;text-transform:uppercase}
.cal-cell{aspect-ratio:1;border-radius:10px;background:var(--bg-elev);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:6px;font-size:12px;position:relative;border:1px solid transparent;cursor:pointer}
.cal-cell.out{opacity:.35;cursor:default}.cal-cell.today{background:var(--ink);color:#fff}
.cal-cell.has::after{content:"";position:absolute;bottom:6px;right:6px;width:5px;height:5px;background:var(--accent);border-radius:50%}
.cal-cell.today.has::after{background:#fff}
.cal-cell .n{font-family:'Geist Mono',monospace;font-weight:600}
.cal-cell .tot{font-size:9px;color:var(--muted);font-family:'Geist Mono',monospace}.cal-cell.today .tot{color:rgba(255,255,255,.7)}
.week-row{display:flex;gap:6px;overflow:auto;padding:2px 0 6px;scrollbar-width:none}.week-row::-webkit-scrollbar{display:none}
.week-day{flex:0 0 60px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.week-day .d{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.week-day .n{font-family:'Geist Mono',monospace;font-size:18px;font-weight:600;margin:2px 0}
.week-day .dot{width:6px;height:6px;border-radius:50%;background:var(--line);margin:2px auto 0}
.week-day.today{background:var(--ink);color:#fff;border-color:var(--ink)}.week-day.today .d,.week-day.today .n{color:#fff}.week-day.has .dot{background:var(--accent)}
/* Collapsible syllabus */
.syl-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 0;user-select:none}
.syl-header i{transition:transform .2s;font-size:12px;color:var(--muted)}
.syl-header.collapsed i{transform:rotate(-90deg)}
.syl-body.collapsed{display:none}
/* Alarm */
.alarm-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.alarm-time{font-family:'Geist Mono',monospace;font-size:28px;font-weight:700}
.alarm-label{font-size:12px;color:var(--muted);margin-top:2px}
/* Timestamp */
.ts{font-family:'Geist Mono',monospace;font-size:10px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="appbar"><div class="appbar-row">
    <div class="brand"><div class="dot"></div><div><div class="name" id="hdrTitle">Home</div><small id="hdrDate"></small></div></div>
    <div style="display:flex;gap:8px">
      <button class="pill-icon" id="btnVoice" title="Voice"><i class="fa-solid fa-microphone"></i></button>
      <button class="pill-icon" id="btnNotif" title="Notifications"><i class="fa-regular fa-bell"></i></button>
      <button class="pill-icon" id="btnSync" title="Sync"><i class="fa-solid fa-rotate"></i></button>
    </div>
  </div><nav class="subnav" id="subnav"></nav></header>
  <section class="screen on" id="scr-home"><div id="setupBanner"></div><div id="home-body"></div></section>
  <section class="screen" id="scr-learn"><h1 class="section-title">📚 Learn</h1><p class="section-sub">Study timer, vocab, spaced repetition & syllabus.</p><div id="learn-body"></div></section>
  <section class="screen" id="scr-tasks"><h1 class="section-title">Tasks</h1><p class="section-sub">Everything to do, done, and in-progress.</p><div id="tasks-body"></div></section>
  <section class="screen" id="scr-notes"><h1 class="section-title">Notes</h1><p class="section-sub">Ideas, gallery & drawing pad.</p><div id="notes-body"></div></section>
  <section class="screen" id="scr-money"><h1 class="section-title">Money</h1><p class="section-sub">Accounts, expenses & calculator.</p><div id="money-body"></div></section>
  <section class="screen" id="scr-body"><h1 class="section-title">Body & Mind</h1><p class="section-sub">Health, journal, focus, habits & alarm.</p><div id="body-body"></div></section>
  <button class="fab" id="fab"><i class="fa-solid fa-plus"></i></button>
  <nav class="tabbar"><div class="tabbar-inner">
    <button class="tab on" data-tab="home"><i class="fa-solid fa-house"></i>Home</button>
    <button class="tab" data-tab="learn"><i class="fa-solid fa-graduation-cap"></i>Learn</button>
    <button class="tab" data-tab="tasks"><i class="fa-solid fa-list-check"></i>Tasks</button>
    <button class="tab" data-tab="notes"><i class="fa-solid fa-book"></i>Notes</button>
    <button class="tab" data-tab="money"><i class="fa-solid fa-indian-rupee-sign"></i>Money</button>
    <button class="tab" data-tab="body"><i class="fa-solid fa-heart-pulse"></i>Body</button>
  </div></nav>
</div>

/* API */
function getUrl(){return WEB_APP_URL}
async function api(p,b){const u=getUrl();if(!u){toast('⚠️ Set WEB_APP_URL');return{ok:false}};try{let r;if(b)r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});else r=await fetch(u+'?'+p);return await r.json()}catch(e){toast('Network error');return{ok:false}}}
const apiAll=()=>api('action=all'),apiList=s=>api('action=list&sheet='+s),apiAdd=(s,r)=>api(null,{action:'add',sheet:s,row:r}),apiUpdate=(s,id,p)=>api(null,{action:'update',sheet:s,id,patch:p}),apiDelete=(s,id)=>api(null,{action:'delete',sheet:s,id}),apiUpload=(b,m,f)=>api(null,{action:'upload',base64:b,mimeType:m,filename:f});
/* Helpers */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),2200)}
function openSheet(h){$('#sheetBody').innerHTML=h;$('#sheet').classList.add('on');$('#sheetBg').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');$('#sheetBg').classList.remove('on')}
$('#sheetBg').onclick=closeSheet;$('#sheetClose').onclick=closeSheet;
function fmtMoney(n){return'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function todayISO(d=new Date()){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function driveImg(item,sz){const fid=item.fileId||item.imageFileId;if(fid)return'https://lh3.googleusercontent.com/d/'+fid+(sz?'=w'+sz:'');const u=item.url||item.imageUrl||'';const m=u.match(/[?&]id=([^&]+)/)||u.match(/\/d\/([^/?]+)/);return m?'https://lh3.googleusercontent.com/d/'+m[1]+(sz?'=w'+sz:''):u}
async function withLoading(btn,fn,txt){if(!btn||btn.disabled)return;const o=btn.innerHTML;btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> '+(txt||'Saving…');try{await fn()}catch(e){toast('Error: '+e)}finally{btn.disabled=false;btn.innerHTML=o}}
function fileToB64(f){return new Promise(r=>{const x=new FileReader();x.onload=()=>r(String(x.result).split(',')[1]);x.readAsDataURL(f)})}
function blobToB64(b){return new Promise(r=>{const x=new FileReader();x.onload=()=>r(String(x.result).split(',')[1]);x.readAsDataURL(b)})}
function safeParse(s,f){try{return JSON.parse(s)}catch{return f}}
function optionsFrom(l,k){const s=new Set();l.forEach(x=>x[k]&&s.add(x[k]));return[...s]}
function dayOfYear(){const n=new Date(),s=new Date(n.getFullYear(),0,0);return Math.floor((n-s)/864e5)}
function minutesToH(m){m=+m||0;return Math.floor(m/60)+'h '+(m%60)+'m'}
function fmtTs(iso){if(!iso)return'';try{return new Date(iso).toLocaleString([],{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch{return iso}}
function getLearnedWords(){const s=new Set();state.cache.VocabDone.forEach(v=>(v.words||'').split(',').filter(Boolean).forEach(w=>s.add(w)));return s}
function getDailyVocab(){const learned=getLearnedWords(),idx=(dayOfYear()*25)%VB.length,w=[];let i=0;while(w.length<25&&i<VB.length){const[word,h]=VB[(idx+i)%VB.length];if(!learned.has(word))w.push([word,h]);i++}return w}

  const wt=state.cache.Health.filter(h=>(h.date||'').slice(0,10)===iso&&h.type==='water').reduce((a,b)=>a+Number(b.value||0),0);

/* #10 HABITS with day remarks */
function renderHabits(el){const habits=state.cache.Habits;el.innerHTML=`<div class="card"><div class="row"><h3>🔥 21-Day Challenges</h3><button class="btn sm accent" id="addH"><i class="fa-solid fa-plus"></i></button></div><div class="sub">Build any habit. Tap a day to mark done with remark.</div>${habits.length?habits.map(h=>{const start=new Date(h.startDate+'T00:00:00'),daysArr=safeParse(h.days,[]),streak=daysArr.length,done=streak>=21;/* backward compat: string or object */const daySet=new Set(daysArr.map(d=>typeof d==='string'?d:d.d));const remarkMap={};daysArr.forEach(d=>{if(typeof d==='object'&&d.r)remarkMap[d.d]=d.r});let grid='';for(let i=0;i<21;i++){const dt=new Date(start);dt.setDate(start.getDate()+i);const iso=todayISO(dt),isDn=daySet.has(iso),isT=iso===todayISO(),rm=remarkMap[iso]||'';grid+=`<div class="habit-cell ${isDn?'done':''} ${isT?'today':''}" data-habit="${h.id}" data-day="${iso}" title="${escapeHtml(rm)}">${i+1}${rm?'<span class="hr">📝</span>':''}</div>`}return`<div class="card mt-8"><div class="row"><div class="t">${escapeHtml(h.name)}</div>${done?'<span class="chip g">✅ Complete!</span>':`<span class="chip gd">${streak}/21</span>`}</div><div class="habit-grid">${grid}</div>${Object.keys(remarkMap).length?`<div class="mt-8" style="font-size:11px">${Object.entries(remarkMap).map(([d,r])=>`<div class="text-muted">Day ${Math.round((new Date(d)-start)/864e5)+1}: ${escapeHtml(r)}</div>`).join('')}</div>`:''}<div class="text-muted" style="font-size:11px;margin-top:6px">Started ${h.startDate}</div></div>`}).join(''):'<div class="empty"><i class="fa-solid fa-fire"></i>No habits. Start one!</div>'}</div>`;$('#addH').onclick=()=>{openSheet(`<h3>New 21-Day Challenge</h3><div class="field mt-8"><div class="col"><label>Habit</label><input id="hbN" placeholder="Wake 5AM, Read 30min…"></div></div><button class="btn accent block mt-16" id="hbS">Start</button>`);$('#hbS').onclick=()=>withLoading($('#hbS'),async()=>{const n=$('#hbN').value.trim();if(!n)return;const r=await apiAdd('Habits',{name:n,startDate:todayISO(),days:'[]',streak:'0',status:'active'});if(r.ok){state.cache.Habits.push(r.data);toast('🔥 Started!');closeSheet();renderScreen()}})};$$('.habit-cell').forEach(c=>c.onclick=async()=>{const h=state.cache.Habits.find(x=>x.id===c.dataset.habit);if(!h)return;const daysArr=safeParse(h.days,[]);const day=c.dataset.day;if(day>todayISO())return toast('Future date');/* normalize to objects */const normalized=daysArr.map(d=>typeof d==='string'?{d,r:''}:d);const existing=normalized.find(x=>x.d===day);if(existing){/* toggle off */const idx=normalized.indexOf(existing);normalized.splice(idx,1)}else{/* add with remark prompt */const remark=prompt('Remark for this day (optional):','')||'';normalized.push({d:day,r:remark})}h.days=JSON.stringify(normalized);h.streak=String(normalized.length);await apiUpdate('Habits',h.id,{days:h.days,streak:h.streak,status:normalized.length>=21?'done':'active'});renderScreen()})}
/* #11 ALARM */
function renderAlarm(el){const alarms=state.cache.Alarms||[];el.innerHTML=`<div class="card"><div class="row"><h3>⏰ Alarm Clock</h3><button class="btn sm accent" id="addAlarm"><i class="fa-solid fa-plus"></i></button></div><div class="sub">Set alarms with custom music. Works while page is open.</div>${alarms.length?alarms.map(a=>`<div class="alarm-card"><div><div class="alarm-time">${escapeHtml(a.time)}</div><div class="alarm-label">${escapeHtml(a.label||'Alarm')} ${a.audioUrl?'🎵':''}</div></div><div style="display:flex;gap:6px;align-items:center"><button class="btn sm ${a.active==='true'?'accent':'ghost'}" data-alarmtoggle="${a.id}">${a.active==='true'?'ON':'OFF'}</button><button class="btn sm ghost" data-role="del" data-sheet="Alarms" data-id="${a.id}"><i class="fa-solid fa-trash"></i></button></div></div>`).join(''):'<div class="empty"><i class="fa-solid fa-bell"></i>No alarms set.</div>'}</div>`;$('#addAlarm').onclick=openAddAlarm;$$('[data-alarmtoggle]').forEach(b=>b.onclick=async()=>{const a=state.cache.Alarms.find(x=>x.id===b.dataset.alarmtoggle);if(!a)return;const ns=a.active==='true'?'false':'true';a.active=ns;await apiUpdate('Alarms',a.id,{active:ns});renderScreen()});bindCommonActions(el)}
function openAddAlarm(){openSheet(`<h3>⏰ New Alarm</h3><div class="field mt-8"><div class="col"><label>Time</label><input id="alTime" type="time" value="06:00"></div></div><div class="field mt-8"><div class="col"><label>Label</label><input id="alLabel" placeholder="Morning wake-up"></div></div><label class="btn ghost sm mt-8"><i class="fa-solid fa-music"></i> Upload Alarm Music <input type="file" accept="audio/*" id="alAudio" hidden></label><span id="alAN" class="chip hidden mt-8"></span><button class="btn accent block mt-16" id="alSave">Save Alarm</button>`);let af=null;$('#alAudio').onchange=e=>{af=e.target.files[0];$('#alAN').textContent=af.name;$('#alAN').classList.remove('hidden')};$('#alSave').onclick=()=>withLoading($('#alSave'),async()=>{const time=$('#alTime').value;if(!time)return toast('Set time');let audioUrl='',audioFileId='';if(af){toast('Uploading music…');const b=await fileToB64(af),u=await apiUpload(b,af.type,af.name);if(u.ok){audioUrl=u.data.url;audioFileId=u.data.fileId}}const r=await apiAdd('Alarms',{time,label:$('#alLabel').value,audioUrl,audioFileId,active:'true',days:''});if(r.ok){state.cache.Alarms.push(r.data);toast('⏰ Alarm set');closeSheet();renderScreen()}})}
/* Alarm checker — runs every 30 seconds */
function checkAlarms(){const now=new Date(),hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');(state.cache.Alarms||[]).forEach(a=>{if(a.active!=='true'||a.time!==hm)return;if(a._fired===hm)return;a._fired=hm;const audio=$('#alarmAudio');if(a.audioUrl||a.audioFileId){audio.src=driveImg({fileId:a.audioFileId,url:a.audioUrl});audio.play().catch(()=>{});toast('⏰ '+escapeHtml(a.label||'Alarm!'))}else{toast('⏰ '+escapeHtml(a.label||'Alarm!'));try{const ctx=new AudioContext(),osc=ctx.createOscillator();osc.connect(ctx.destination);osc.frequency.value=880;osc.start();setTimeout(()=>osc.stop(),3000)}catch{}}})}
setInterval(checkAlarms,30000);
/* FOCUS TIMER */
function startFocus(mins,remarks){state.focus.running=true;state.focus.paused=false;state.focus.endsAt=Date.now()+mins*6e4;state.focus.remaining=mins*60;state.focus.remarks=remarks||'Study';state.focus.duration=mins;apiAdd('Focus',{duration:mins,remarks:remarks||'Study',startedAt:new Date().toISOString()}).then(r=>{state.focus.id=r.ok?r.data.id:null});$('#focusLbl').textContent=remarks||'Study session';$('#focusQt').textContent=MQ[Math.floor(Math.random()*MQ.length)][0];$('#focusCover').classList.add('on');if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});tickFocus()}
function tickFocus(){if(!state.focus.running)return;const rem=state.focus.paused?state.focus.remaining:Math.max(0,Math.round((state.focus.endsAt-Date.now())/1000));state.focus.remaining=rem;$('#focusClock').textContent=String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0');if(rem<=0){endFocus(true);return}requestAnimationFrame(()=>setTimeout(tickFocus,500))}
async function endFocus(ok){state.focus.running=false;$('#focusCover').classList.remove('on');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});if(state.focus.id)await apiUpdate('Focus',state.focus.id,{completedAt:ok?new Date().toISOString():'',remarks:state.focus.remarks});if(ok)toast('✅ Session complete');sync()}
$('#focusStop').onclick=()=>endFocus(false);
$('#focusPause').onclick=()=>{if(state.focus.paused){state.focus.endsAt=Date.now()+state.focus.remaining*1000;state.focus.paused=false;$('#focusPause').textContent='Pause';tickFocus()}else{state.focus.paused=true;$('#focusPause').textContent='Resume'}};
/* COMMON ACTIONS */
function bindCommonActions(root){$$('[data-role="task-toggle"]',root).forEach(b=>b.onclick=async()=>{const t=state.cache.Tasks.find(x=>x.id===b.dataset.id),ns=t.status==='done'?'open':'done',patch={status:ns,completed:ns==='done'?new Date().toISOString():''};Object.assign(t,patch);toast('Saving…');await apiUpdate('Tasks',t.id,patch);renderScreen()});$$('[data-role="del"]',root).forEach(b=>b.onclick=async()=>{if(!confirm('Delete?'))return;toast('Deleting…');await apiDelete(b.dataset.sheet,b.dataset.id);state.cache[b.dataset.sheet]=state.cache[b.dataset.sheet].filter(x=>x.id!==b.dataset.id);renderScreen()});$$('[data-role="mark-done"]',root).forEach(b=>b.onclick=async()=>{const l=state.cache.Learning.find(x=>x.id===b.dataset.id),dn=(l.doneDates||'').split(',').filter(Boolean);if(!dn.includes(b.dataset.date))dn.push(b.dataset.date);l.doneDates=dn.join(',');toast('Saving…');await apiUpdate('Learning',l.id,{doneDates:l.doneDates});toast('✅ Done');renderScreen()})}
/* FAB */
$('#fab').onclick=()=>{const t=state.tab,s=state.sub[t];if(t==='home')return openAddTask();if(t==='tasks'&&s==='projects')return openAddProj();if(t==='tasks')return openAddTask();if(t==='learn'&&s==='syllabus')return openAddSyl();if(t==='learn'&&s==='vocab')return toast('New words daily');if(t==='learn'&&s==='timer')return toast('Use timer above');if(t==='learn')return openAddLearn();if(t==='notes'&&s==='gallery')return openAddImg();if(t==='notes'&&s==='draw')return openDrawPad();if(t==='notes')return openAddNote();if(t==='money'&&s==='calc')return toast('Use calc');if(t==='money')return openAddFin();if(t==='body'&&s==='habits')return;if(t==='body'&&s==='alarm')return openAddAlarm();if(t==='body'&&(s==='journal'||s==='focus'))return toast('Use form above');if(t==='body')return openAddHealth()};
function openAddTask(){openSheet(`<h3>New task</h3><div class="field mt-8"><div class="col"><label>Title</label><input id="tT" placeholder="What needs doing?"></div></div><div class="grid-2 mt-8"><div class="field"><div class="col"><label>Due</label><input id="tD" type="date" value="${todayISO()}"></div></div><div class="field"><div class="col"><label>Priority</label><select id="tP"><option>low</option><option selected>normal</option><option>high</option></select></div></div></div><div class="field mt-8"><div class="col"><label>Notes</label><textarea id="tN"></textarea></div></div><button class="btn accent block mt-16" id="tS">Save</button>`);$('#tS').onclick=()=>withLoading($('#tS'),async()=>{const title=$('#tT').value.trim();if(!title)return;const r=await apiAdd('Tasks',{title,due:$('#tD').value,priority:$('#tP').value,notes:$('#tN').value,status:'open'});if(r.ok){state.cache.Tasks.push(r.data);toast('Saved');closeSheet();renderScreen()}})}
function openAddProj(){openSheet(`<h3>New project</h3><div class="field mt-8"><div class="col"><label>Name</label><input id="pN"></div></div><div class="field mt-8"><div class="col"><label>Status</label><select id="pS"><option>Pending</option><option>In-Progress</option></select></div></div><div class="field mt-8"><div class="col"><label>Description</label><textarea id="pDe"></textarea></div></div><button class="btn accent block mt-16" id="pSv">Save</button>`);$('#pSv').onclick=()=>withLoading($('#pSv'),async()=>{const n=$('#pN').value.trim();if(!n)return;const r=await apiAdd('Projects',{name:n,status:$('#pS').value,description:$('#pDe').value,remarks:'[]'});if(r.ok){state.cache.Projects.push(r.data);closeSheet();renderScreen()}})}
function openAddLearn(){const sub=optionsFrom(state.cache.Learning,'subject');openSheet(`<h3>New topic</h3><div class="field mt-8"><div class="col"><label>Topic</label><input id="lT"></div></div><div class="field mt-8"><div class="col"><label>Subject</label><input id="lS" list="sbj"></div></div><datalist id="sbj">${sub.map(s=>`<option value="${escapeHtml(s)}">`).join('')}</datalist><div class="field mt-8"><div class="col"><label>Notes</label><textarea id="lN"></textarea></div></div><button class="btn accent block mt-8" id="lSv">Add</button>`);$('#lSv').onclick=()=>withLoading($('#lSv'),async()=>{const t=$('#lT').value.trim();if(!t)return;const s=todayISO(),r=await apiAdd('Learning',{topic:t,subject:$('#lS').value,notes:$('#lN').value,startDate:s,reviewDates:compRev(s),doneDates:''});if(r.ok){state.cache.Learning.push(r.data);closeSheet();renderScreen();toast('Added')}})}
function openAddSyl(){const sub=optionsFrom(state.cache.Syllabus,'subject');openSheet(`<h3>Add chapter</h3><div class="field mt-8"><div class="col"><label>Subject</label><input id="sS" list="sbs"></div></div><datalist id="sbs">${sub.map(s=>`<option value="${escapeHtml(s)}">`).join('')}</datalist><div class="field mt-8"><div class="col"><label>Chapter</label><input id="sC"></div></div><div class="field mt-8"><div class="col"><label>Sub-topic</label><input id="sSb"></div></div><button class="btn accent block mt-8" id="sSv">Save</button>`);$('#sSv').onclick=()=>withLoading($('#sSv'),async()=>{const s=$('#sS').value.trim(),c=$('#sC').value.trim();if(!s||!c)return;const r=await apiAdd('Syllabus',{subject:s,chapter:c,sub:$('#sSb').value,notes:'',status:'pending'});if(r.ok){state.cache.Syllabus.push(r.data);closeSheet();renderScreen()}})}
function openAddNote(){openSheet(`<h3>New note</h3><div class="field mt-8"><div class="col"><label>Title</label><input id="nT"></div></div><div class="field mt-8"><div class="col"><label>Body</label><textarea id="nB" style="min-height:100px"></textarea></div></div><div class="field mt-8"><div class="col"><label>Tags</label><input id="nTg" placeholder="idea, work"></div></div><div style="display:flex;gap:6px;margin-top:10px"><label class="btn ghost sm"><i class="fa-solid fa-image"></i> Image <input type="file" accept="image/*" id="nAt" hidden></label><span id="nAN" class="chip hidden"></span></div><button class="btn accent block mt-16" id="nSv">Save</button>`);let pf=null;$('#nAt').onchange=e=>{pf=e.target.files[0];$('#nAN').textContent=pf.name;$('#nAN').classList.remove('hidden')};$('#nSv').onclick=()=>withLoading($('#nSv'),async()=>{const atts=[];if(pf){toast('Uploading…');const b=await fileToB64(pf),r=await apiUpload(b,pf.type,pf.name);if(r.ok)atts.push({...r.data,mimeType:pf.type})}const r=await apiAdd('Notes',{title:$('#nT').value,body:$('#nB').value,tags:$('#nTg').value,attachments:JSON.stringify(atts)});if(r.ok){state.cache.Notes.push(r.data);toast('Saved');closeSheet();renderScreen()}})}
function openAddImg(){const groups=allGroups();openSheet(`<h3>Add to gallery</h3><label class="btn ghost sm mt-8"><i class="fa-solid fa-camera"></i> Camera <input type="file" accept="image/*" capture="environment" id="gI1" hidden></label><label class="btn ghost sm mt-8"><i class="fa-solid fa-folder-open"></i> Files <input type="file" accept="image/*" id="gI2" hidden></label><span id="gIN" class="chip hidden mt-8"></span><div class="field mt-8"><div class="col"><label>Group</label><select id="gGr">${groups.map(g=>`<option>${escapeHtml(g)}</option>`).join('')}<option value="__new">＋ New</option></select></div></div><div class="field mt-8"><div class="col"><label>Remarks</label><textarea id="gRm"></textarea></div></div><button class="btn accent block mt-16" id="gSv">Save</button>`);let file=null;const sf=f=>{file=f;$('#gIN').textContent=f.name;$('#gIN').classList.remove('hidden')};$('#gI1').onchange=e=>sf(e.target.files[0]);$('#gI2').onchange=e=>sf(e.target.files[0]);$('#gGr').onchange=e=>{if(e.target.value==='__new'){const g=prompt('Group?');if(g){const o=document.createElement('option');o.value=g;o.textContent=g;o.selected=true;e.target.insertBefore(o,e.target.querySelector('[value=__new]'))}else e.target.value=groups[0]||'Default'}};$('#gSv').onclick=()=>withLoading($('#gSv'),async()=>{if(!file)return toast('Choose image');const b=await fileToB64(file),u=await apiUpload(b,file.type,file.name);if(!u.ok)return toast('Failed');const r=await apiAdd('Images',{groupName:$('#gGr').value||'Default',url:u.data.url,fileId:u.data.fileId,remarks:$('#gRm').value,tags:''});if(r.ok){state.cache.Images.push(r.data);toast('Saved');closeSheet();renderScreen()}})}
function openAddFin(){const cats=optionsFrom(state.cache.Finance,'category'),accs=[...DA,...optionsFrom(state.cache.Accounts,'name')].filter((v,i,a)=>a.indexOf(v)===i);openSheet(`<h3>New transaction</h3><div class="field mt-8"><div class="col"><label>Type</label><select id="fT"><option value="income">Income</option><option value="expense" selected>Expense</option><option value="savings-in">Savings in</option><option value="savings-out">Savings out</option></select></div></div><div class="grid-2 mt-8"><div class="field"><div class="col"><label>Amount</label><input id="fA" type="number" step="0.01"></div></div><div class="field"><div class="col"><label>Date</label><input id="fD" type="date" value="${todayISO()}"></div></div></div><div class="field mt-8"><div class="col"><label>Category</label><input id="fC" list="cl" placeholder="Groceries…"></div></div><datalist id="cl">${cats.map(c=>`<option value="${escapeHtml(c)}">`).join('')}</datalist><div class="field mt-8"><div class="col"><label>Account</label><select id="fAc">${accs.map(a=>`<option>${escapeHtml(a)}</option>`).join('')}</select></div></div><div class="field mt-8"><div class="col"><label>Note</label><input id="fN"></div></div><button class="btn accent block mt-16" id="fSv">Save</button>`);$('#fSv').onclick=()=>withLoading($('#fSv'),async()=>{const amt=+$('#fA').value;if(!amt)return;const r=await apiAdd('Finance',{type:$('#fT').value,category:$('#fC').value,amount:amt,account:$('#fAc').value,note:$('#fN').value,date:$('#fD').value});if(r.ok){state.cache.Finance.push(r.data);toast('Saved');closeSheet();renderScreen()}})}
function openAddHealth(){const cats=['water','meal','exercise','sleep','wakeup','travel'],meals=['Breakfast','Lunch','Dinner','Snacks'];openSheet(`<h3>Log</h3><div class="field mt-8"><div class="col"><label>Type</label><select id="hT">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div></div><div id="hMW" class="field mt-8 hidden"><div class="col"><label>Meal</label><select id="hM">${meals.map(m=>`<option>${m}</option>`).join('')}</select></div></div><div class="grid-2 mt-8"><div class="field"><div class="col"><label>Value</label><input id="hV"></div></div><div class="field"><div class="col"><label>Unit</label><input id="hU" placeholder="ml, min, hr"></div></div></div><div class="field mt-8"><div class="col"><label>Note</label><input id="hN"></div></div><button class="btn accent block mt-16" id="hSv">Save</button>`);const tog=()=>$('#hMW').classList.toggle('hidden',$('#hT').value!=='meal');$('#hT').onchange=tog;tog();$('#hSv').onclick=()=>withLoading($('#hSv'),async()=>{const r=await apiAdd('Health',{type:$('#hT').value,value:$('#hV').value,unit:$('#hU').value,meal:$('#hT').value==='meal'?$('#hM').value:'',note:$('#hN').value,date:todayISO()});if(r.ok){state.cache.Health.push(r.data);closeSheet();renderScreen();toast('Logged')}})}
/* VOICE: "Ji Sir" */
let voiceRec=null,voiceMR=null,voiceStr=null,voiceCh=[];
function initVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;voiceRec=new SR();voiceRec.continuous=true;voiceRec.interimResults=true;voiceRec.lang='hi-IN';voiceRec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript.toLowerCase();if(t.includes('जी सर')||t.includes('ji sir'))startVR();if(t.includes('बस')||t.includes('stop')||t.includes('bas'))stopVR()}};voiceRec.onerror=()=>{};voiceRec.onend=()=>{if(state.voiceActive)voiceRec.start()}}
$('#btnVoice').onclick=()=>{if(!voiceRec)initVoice();if(!voiceRec)return toast('Not supported');if(state.voiceActive){state.voiceActive=false;voiceRec.stop();stopVR();$('#btnVoice').innerHTML='<i class="fa-solid fa-microphone"></i>';toast('Voice off')}else{state.voiceActive=true;voiceRec.start();$('#btnVoice').innerHTML='<span class="voice-dot"></span>';toast('Listening… say "Ji Sir"')}};
async function startVR(){if(voiceMR)return;try{voiceStr=await navigator.mediaDevices.getUserMedia({audio:true});voiceMR=new MediaRecorder(voiceStr);voiceCh=[];voiceMR.ondataavailable=e=>voiceCh.push(e.data);voiceMR.onstop=async()=>{const blob=new Blob(voiceCh,{type:'audio/webm'}),b=await blobToB64(blob);toast('Uploading…');const r=await apiUpload(b,'audio/webm','rec-'+Date.now()+'.webm');if(r.ok){await apiAdd('Recordings',{url:r.data.url,fileId:r.data.fileId,timestamp:new Date().toISOString()});toast('🎙️ Saved')}};voiceMR.start();toast('🔴 Recording… say "Stop"')}catch{toast('Mic denied')}}
function stopVR(){if(voiceMR){voiceMR.stop();if(voiceStr)voiceStr.getTracks().forEach(t=>t.stop());voiceMR=null;voiceStr=null}}
/* NOTIFICATIONS */
function notify(t,b){if('Notification' in window&&Notification.permission==='granted')new Notification(t,{body:b})}
$('#btnNotif').onclick=async()=>{if(!('Notification' in window))return toast('Not supported');await Notification.requestPermission();toast('Notifications '+Notification.permission);startHrQ()};
function startHrQ(){if(Notification.permission!=='granted')return;setInterval(()=>{const q=MQ[Math.floor(Math.random()*MQ.length)];notify('💪 LifeOS',q[0]+' — '+q[1])},36e5)}
/* RENDER */
function renderScreen(){if(state.tab==='home')renderHome();if(state.tab==='learn')renderLearn();if(state.tab==='tasks')renderTasks();if(state.tab==='notes')renderNotes();if(state.tab==='money'){renderMoney();if(state.sub.money==='calc')bindCalc()}if(state.tab==='body')renderBody()}
/* BOOT */
(async function(){renderSubnav();if(!getUrl())showSetup();else await sync();renderScreen();startHrQ();initDraw()})();
</script></body></html>
